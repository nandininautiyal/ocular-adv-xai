# Training recipe for the cross-session protocol (02_make_splits.py --protocol cross_session):
# configs/baseline.yml with a real schedule. Model, ArcFace head, learning rate, batch size,
# fine_tune_at and augmentation are unchanged, so a difference from the baseline comes from
# the protocol and the schedule only.
#
# Why: in baseline.yml EarlyStopping (patience 20 in a 10-epoch run) never fires and
# ReduceLROnPlateau (min_lr == learning_rate) never lowers the rate, so the run simply trains
# for 10 epochs and keeps the epoch with the lowest val_loss. On the random split that hardly
# mattered (near-duplicate frames on both sides); on the cross-session split validation comes
# from held-out enrollment buckets, so val_loss can stop improving early and the model then
# overfits the training buckets. One epoch of the random split took about 17 min on a Kaggle
# T4 (25/27 Oct), so the cap matters for the 12-hour session too: 30 such epochs are about
# 8.5 h. Use 03 --resume so that a run can continue in the next session.
model:
  input_shape: [256, 256, 3]
  n_classes: 300          # VISOB IDs 1141-3279 plus 7000 (confirmed: 300 class folders)
  fine_tune_at: 100
  dense_units: 1024

arcface:
  scale: 64.0
  margin: 0.50

training:
  batch_size: 32
  epochs: 30              # a cap, not a target: early stopping normally ends the run before it
  learning_rate: 0.0001   # unchanged from baseline.yml
  early_stop_patience: 5  # stop after 5 epochs without a lower val_loss...
  early_stop_restore_best: true   # ...and go back to the weights of the best epoch (03 also reloads the
                                  # best checkpoint before testing; this keeps the in-memory model right too)
  reduce_lr_patience: 2   # lower the rate after 2 epochs without improvement, so it drops at least
                          # twice before early stopping (patience 5) ends the run
  reduce_lr_factor: 0.2   # 1e-4 -> 2e-5 -> 4e-6 -> 1e-6
  min_lr: 1.0e-6          # below learning_rate, so the reduction really happens (baseline: equal, a no-op)

data:
  train_dir: "ocular_recognition/train"
  val_dir: "ocular_recognition/validation"
  test_dir: "ocular_recognition/test"
  target_size: [256, 256]
  class_mode: "categorical"

paths:
  model_save_dir: "trained_models"
  model_name: "Xception_best_model_ArcFace_Base.h5"
  adversarial_dir: "Adversarial_Images"
